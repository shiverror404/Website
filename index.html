<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI</title>
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 25, 0.85);
            --text: #e0e0e0;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --user-msg: #004e92;
            --bot-msg: rgba(30, 30, 40, 0.9);
            --border-color: rgba(0, 210, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #101826 0%, #050505 70%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 15px 20px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* Logo Style */
        header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            object-fit: cover;
            animation: pulseGlow 3s infinite alternate;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: slideUp 0.3s ease-out forwards;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.3);
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .typing {
            align-self: flex-start;
            font-style: italic;
            color: var(--accent);
            font-size: 0.9rem;
            display: none;
            margin-top: 10px;
            text-shadow: 0 0 5px var(--accent-glow);
            animation: blink 1.5s infinite;
        }

        /* Input Area */
        #input-area {
            padding: 15px 20px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            z-index: 10;
        }

        #user-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 20px;
            border: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            outline: none;
            resize: none;
            max-height: 120px;
            transition: all 0.3s ease;
        }

        #user-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #send-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: 0.2s;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        #send-btn:active { transform: scale(0.9); }
        #send-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { from { box-shadow: 0 0 10px var(--accent-glow); } to { box-shadow: 0 0 25px var(--accent); } }
        @keyframes blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <!-- APNE LOGO KA LINK YAHAN DAALNA HAI -->
<img src="https://raw.githubusercontent.com/shiverror404/Website/main/file_00000000acdc82118e20363e93b6c517.png" alt="J" id="bot-logo">
        <h1>JARVIS AI</h1>
    </header>

    <!-- History clear karne ka button (Optional, par useful hai) -->
    <button onclick="clearHistory()" style="position: absolute; top: 18px; right: 15px; background: transparent; color: #888; border: 1px solid #444; padding: 5px 10px; border-radius: 15px; font-size: 0.7rem; cursor: pointer; z-index: 20;">Clear</button>

    <div id="chat-container">
        <!-- Messages yahan JS se load honge -->
        <div class="typing" id="typing-indicator">JARVIS is typing...</div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Message JARVIS..."></textarea>
        <button id="send-btn">➤</button>
    </div>

    <script>
        const API_URL = "https://website-1wy5.onrender.com/chat"; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // LocalStorage se history load karo
        let chatHistory = JSON.parse(localStorage.getItem('jarvisHistory')) || [];

        // Page load hote hi purane messages render karo
        function loadHistory() {
            // Purane messages hatao (typing indicator chhod ke)
            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(msg => msg.remove());

            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.classList.add('message', msg.role === 'user' ? 'user-message' : 'bot-message');
                div.textContent = msg.content;
                chatContainer.insertBefore(div, typingIndicator);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Initial welcome message agar history khaali hai
        function showWelcome() {
            if (chatHistory.length === 0) {
                const div = document.createElement('div');
                div.classList.add('message', 'bot-message');
                div.textContent = "Namaste, sir. Main JARVIS hoon. Aaj main aapki kya madad kar sakta hoon?";
                chatContainer.insertBefore(div, typingIndicator);
            }
        }

        loadHistory();
        showWelcome();

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            div.textContent = text;
            chatContainer.insertBefore(div, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveHistory() {
            // Sirf last 50 messages save karo taaki browser slow na ho
            if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);
            localStorage.setItem('jarvisHistory', JSON.stringify(chatHistory));
        }

        function clearHistory() {
            if (confirm("Kya aap sach mein chat history delete karna chahte hain?")) {
                chatHistory = [];
                localStorage.removeItem('jarvisHistory');
                loadHistory();
                showWelcome();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatHistory.push({ role: "user", content: text }); // LocalStorage ke liye
            saveHistory();

            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            typingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                // API ko bhejte waqt pichli history bhi bhejte hain
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory.slice(0, -1) }), // Last message user ka hi hai
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                
                typingIndicator.style.display = 'none';
                addMessage(data.reply, 'bot');
                
                chatHistory.push({ role: "assistant", content: data.reply });
                saveHistory();

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage("⚠️ Network error ya server so raha hai. Kuch der baad try karo.", 'bot');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
