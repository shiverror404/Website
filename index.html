<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --panel: #171717;
            --text: #ececec;
            --accent: #3b82f6;
            --user-msg: #2563eb;
            --bot-msg: #212121;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        
        /* Header */
        header { padding: 15px; text-align: center; background: var(--panel); border-bottom: 1px solid #333; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; gap: 10px; }
        header img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--accent); object-fit: cover;}

        /* Chat Area */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; white-space: pre-wrap; }
        .user-message { align-self: flex-end; background-color: var(--user-msg); color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background-color: var(--bot-msg); border: 1px solid #333; border-bottom-left-radius: 4px; }
        
        /* Typing Indicator */
        .typing { font-style: italic; color: #888; font-size: 0.9rem; display: none; }

        /* Input Area */
        #input-area { padding: 15px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid #333; }
        #user-input { flex: 1; padding: 12px 15px; border-radius: 25px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; outline: none; resize: none; max-height: 120px; }
        #user-input:focus { border-color: var(--accent); }
        #send-btn { background: var(--accent); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; transition: 0.2s; }
        #send-btn:active { transform: scale(0.95); }
        #send-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <!-- YAHAN APNE LOGO KA LINK DAALNA BAAD MEIN -->
        <img src="https://cdn-icons-png.flaticon.com/512/8649/8649607.png" alt="J">
        JARVIS AI
    </header>

    <div id="chat-container">
        <div class="message bot-message">Namaste, sir. Main JARVIS hoon. Aaj main aapki kya madad kar sakta hoon?</div>
        <div class="typing" id="typing-indicator">JARVIS is typing...</div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Message JARVIS..."></textarea>
        <button id="send-btn">➤</button>
    </div>

    <script>
        // ⚠️ YAHAN RENDER WALA LINK DAALNA HAI ⚠️
        const API_URL = "https://website-1wy5.onrender.com/chat"; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        let chatHistory = [];

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            div.textContent = text;
            chatContainer.insertBefore(div, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            typingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });
                
                const data = await response.json();
                
                typingIndicator.style.display = 'none';
                addMessage(data.reply, 'bot');

                // History update karo
                chatHistory.push({ role: "user", content: text });
                chatHistory.push({ role: "assistant", content: data.reply });
                if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage("⚠️ Network error. Server check karo.", 'bot');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
