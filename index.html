<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI</title>
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 25, 0.85);
            --text: #e0e0e0;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --user-msg: #004e92;
            --bot-msg: rgba(30, 30, 40, 0.9);
            --border-color: rgba(0, 210, 255, 0.2);
            --sidebar-bg: #111;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #101826 0%, #050505 70%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Sidebar (History Menu) */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0; bottom: 0; left: -280px;
            z-index: 100;
            transition: left 0.3s ease-in-out;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }

        .sidebar-header {
            padding: 15px; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            color: #fff; font-weight: bold;
        }
        #close-sidebar { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }

        .new-chat-btn {
            background: var(--accent); color: #000; border: none; padding: 12px;
            border-radius: 8px; cursor: pointer; font-weight: bold; width: calc(100% - 30px);
            margin: 15px; box-shadow: 0 0 10px var(--accent-glow); transition: 0.2s;
        }
        .new-chat-btn:active { transform: scale(0.98); }

        #history-list { flex: 1; overflow-y: auto; padding: 0 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;}
        .history-item {
            padding: 12px; background: #1a1a1a; border-radius: 8px; cursor: pointer;
            font-size: 0.9rem; color: #bbb; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; border: 1px solid transparent; transition: 0.2s;
        }
        .history-item:hover, .history-item.active { border-color: var(--accent); color: #fff; background: #2a2a2a; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 99; display: none; backdrop-filter: blur(2px); }

        /* Header */
        header {
            padding: 15px 20px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            position: relative;
        }

        /* Menu Button (Left Side) */
        #menu-btn {
            position: absolute;
            left: 15px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Logo Style (Same as old) */
        header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            object-fit: cover;
            animation: pulseGlow 3s infinite alternate;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Clear Button (Right Side - Same as old) */
        .clear-btn {
            position: absolute; top: 20px; right: 15px;
            background: transparent; color: #888;
            border: 1px solid #444; padding: 5px 10px;
            border-radius: 15px; font-size: 0.7rem;
            cursor: pointer; z-index: 20;
        }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: slideUp 0.3s ease-out forwards;
        }

        .user-message {
            align-self: flex-end;
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.3);
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .typing {
            align-self: flex-start;
            font-style: italic;
            color: var(--accent);
            font-size: 0.9rem;
            display: none;
            margin-top: 10px;
            text-shadow: 0 0 5px var(--accent-glow);
            animation: blink 1.5s infinite;
        }

        /* Input Area */
        #input-area {
            padding: 15px 20px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            z-index: 10;
        }

        #user-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 20px;
            border: 1px solid #333;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1rem;
            outline: none;
            resize: none;
            max-height: 120px;
            transition: all 0.3s ease;
        }

        #user-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #send-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: 0.2s;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        #send-btn:active { transform: scale(0.9); }
        #send-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { from { box-shadow: 0 0 10px var(--accent-glow); } to { box-shadow: 0 0 25px var(--accent); } }
        @keyframes blink { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>History</span>
            <button id="close-sidebar">✖</button>
        </div>
        <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
        <div id="history-list"></div>
    </div>
    <div id="overlay"></div>

    <!-- Main Content -->
    <header>
        <button id="menu-btn">☰</button>
        <img src="https://raw.githubusercontent.com/shiverror404/Website/main/file_00000000acdc82118e20363e93b6c517.png" alt="J" id="bot-logo">
        <h1>JARVIS AI</h1>
    </header>

    <button class="clear-btn" onclick="clearCurrentChat()">Clear</button>

    <div id="chat-container">
        <div class="typing" id="typing-indicator">JARVIS is typing...</div>
    </div>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Message JARVIS..."></textarea>
        <button id="send-btn">➤</button>
    </div>

    <script>
        const API_URL = "https://website-1wy5.onrender.com/chat"; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        
        // Sidebar Elements
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const historyList = document.getElementById('history-list');
        const newChatBtn = document.getElementById('new-chat-btn');

        // All Chats Data
        let allChats = JSON.parse(localStorage.getItem('jarvis_multi_chats')) || [];
        let currentChatId = null;

        // Initialize on load
        window.onload = () => {
            if (allChats.length === 0) {
                createNewChat();
            } else {
                currentChatId = allChats[allChats.length - 1].id; // Load latest
                loadChat(currentChatId);
            }
        };

        // Sidebar Logic
        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.style.display = 'block'; };
        function closeSidebar() { sidebar.classList.remove('open'); overlay.style.display = 'none'; }
        closeSidebarBtn.onclick = closeSidebar;
        overlay.onclick = closeSidebar;

        function saveToLocal() {
            localStorage.setItem('jarvis_multi_chats', JSON.stringify(allChats));
            renderHistoryList();
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            const sorted = [...allChats].sort((a, b) => b.id - a.id);
            sorted.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title || "New Chat";
                div.onclick = () => loadChat(chat.id);
                historyList.appendChild(div);
            });
        }

        function getCurrentChat() {
            return allChats.find(c => c.id === currentChatId);
        }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: "New Chat",
                messages: []
            };
            allChats.push(newChat);
            currentChatId = newChat.id;
            saveToLocal();
            
            chatContainer.innerHTML = '<div class="typing" id="typing-indicator">JARVIS is typing...</div>';
            const typing = document.getElementById('typing-indicator');
            if(typing) typing.style.display = 'none';
            addMessage("Namaste, sir. Main JARVIS hoon. Aaj main aapki kya madad kar sakta hoon?", 'bot', false);
            closeSidebar();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = getCurrentChat();
            
            chatContainer.innerHTML = '<div class="typing" id="typing-indicator">JARVIS is typing...</div>';
            
            if (chat.messages.length === 0) {
                addMessage("Namaste, sir. Main JARVIS hoon. Aaj main aapki kya madad kar sakta hoon?", 'bot', false);
            } else {
                chat.messages.forEach(msg => {
                    addMessage(msg.content, msg.role, false);
                });
            }
            renderHistoryList();
            closeSidebar();
        }

        function addMessage(text, role, save = true) {
            const div = document.createElement('div');
            div.classList.add('message', role === 'user' ? 'user-message' : 'bot-message');
            div.textContent = text;
            
            // Insert before typing indicator
            const typing = document.getElementById('typing-indicator');
            chatContainer.insertBefore(div, typing);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save) {
                const chat = getCurrentChat();
                chat.messages.push({ role, content: text });
                
                // Update title if it's the first user message
                if (role === 'user' && chat.messages.length === 1) {
                    chat.title = text.substring(0, 25) + (text.length > 25 ? "..." : "");
                }
                saveToLocal();
            }
        }

        function clearCurrentChat() {
            if (confirm("Kya aap is chat ko clear karna chahte hain?")) {
                const chat = getCurrentChat();
                chat.messages = [];
                chat.title = "New Chat";
                saveToLocal();
                loadChat(currentChatId);
            }
        }

        newChatBtn.onclick = createNewChat;

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const typing = document.getElementById('typing-indicator');
            if(typing) typing.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const chat = getCurrentChat();
                const contextMessages = chat.messages.slice(0, -1).slice(-15); // Send max 15 messages for context

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: contextMessages }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const data = await response.json();
                
                if(typing) typing.style.display = 'none';
                addMessage(data.reply, 'bot');

            } catch (error) {
                if(typing) typing.style.display = 'none';
                addMessage("⚠️ Network error ya server so raha hai. Kuch der baad try karo.", 'bot');
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
