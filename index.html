<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS AI</title>
<meta name="description" content="JARVIS AI is a personal assistant you can talk to in Hindi, English or Hinglish.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a111d" id="meta-theme">
<meta property="og:title" content="JARVIS AI">
<meta property="og:description" content="Ask anything in Hindi, English or Hinglish.">
<meta property="og:type" content="website">
<link rel="icon" href="https://raw.githubusercontent.com/shiverror404/Website/main/file_00000000acdc82118e20363e93b6c517.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* Apply saved theme before first paint to avoid a flash. */
  (function () {
    try {
      var t = localStorage.getItem('jarvis_theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('meta-theme').setAttribute('content', t === 'light' ? '#f3f6fb' : '#0a111d');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a111d;
    --surface: #101a2a;
    --surface-2: #17243a;
    --line: #223350;
    --text: #e7edf6;
    --muted: #8fa0b8;
    --accent: #3bd6ff;
    --on-accent: #03202c;
    --user-bg: #17406b;
    --on-user: #eef7ff;
    --danger: #ff7a7a;
    --focus: rgba(59, 214, 255, 0.2);
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f6fb;
    --surface: #ffffff;
    --surface-2: #e9eff8;
    --line: #d6e0ed;
    --text: #0e1a2c;
    --muted: #56677f;
    --accent: #07739b;
    --on-accent: #ffffff;
    --user-bg: #07739b;
    --on-user: #ffffff;
    --danger: #c43c3c;
    --focus: rgba(7, 115, 155, 0.18);
    --shadow: 0 18px 50px rgba(15, 35, 70, 0.16);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  [hidden] { display: none !important; }

  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

  /* ---------- avatar and ring (the one signature motif) ---------- */
  .avatar { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--accent); font-weight: 700; overflow: hidden; flex: none; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .avatar.lg { width: 76px; height: 76px; font-size: 1.8rem; }
  .avatar.sm { width: 30px; height: 30px; }
  .orb { position: relative; display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; }
  .orb::before, .orb.mini::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), transparent 38%, transparent 62%, var(--accent));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    animation: spin 9s linear infinite;
  }
  .orb.mini { width: 36px; height: 36px; flex: none; }
  .orb.mini::before { animation-duration: 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- sidebar ---------- */
  .sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px 12px; gap: 12px; }
  .side-top { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; }
  .btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; transition: filter .15s, transform .1s; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: var(--bg); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .search input { flex: 1; min-width: 0; padding: 10px 0; background: none; border: 0; outline: 0; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  #history-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .group-label { padding: 14px 10px 6px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .hist-item { position: relative; display: flex; align-items: center; border-radius: 10px; }
  .hist-item:hover { background: var(--surface-2); }
  .hist-item.active { background: var(--surface-2); }
  .hist-item.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
  .hist-title { flex: 1; min-width: 0; text-align: left; padding: 10px 12px; font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 10px; }
  .hist-item:not(.active) .hist-title { color: var(--muted); }
  .hist-del { display: grid; place-items: center; width: 34px; height: 34px; margin-right: 4px; border-radius: 8px; color: var(--muted); opacity: 0; transition: opacity .15s, color .15s; }
  .hist-item:hover .hist-del, .hist-item:focus-within .hist-del { opacity: 1; }
  .hist-del:hover { color: var(--danger); }
  .empty-list { padding: 18px 10px; font-size: 0.9rem; color: var(--muted); }
  .side-foot { padding: 4px 8px 0; font-size: 0.78rem; color: var(--muted); }
  .scrim { display: none; }

  /* ---------- header ---------- */
  .topbar { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); z-index: 5; }
  .icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; color: var(--muted); transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .topbar .mobile-brand { display: none; }
  .chat-title { flex: 1; min-width: 0; font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .text-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; color: var(--muted); transition: background .15s, color .15s; }
  .text-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
  .text-btn:disabled { opacity: 0.4; cursor: default; }
  #menu-btn { display: none; }

  /* ---------- messages ---------- */
  .messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .column { display: flex; flex-direction: column; gap: 24px; max-width: 780px; margin: 0 auto; padding: 26px 16px 10px; min-height: 100%; }
  .thread { display: flex; flex-direction: column; gap: 24px; }
  .msg { display: flex; gap: 12px; min-width: 0; }
  /* Sent message: springs up from the composer */
  .msg.enter.msg-user .bubble { transform-origin: 100% 100%; animation: sendIn .46s cubic-bezier(.2, .9, .25, 1.12) both; }
  @keyframes sendIn { from { opacity: 0; transform: translateY(28px) scale(.88); } to { opacity: 1; transform: none; } }
  /* Received message: soft rise, avatar pops, words fade in one by one */
  .msg.enter.msg-bot { animation: botIn .42s cubic-bezier(.22, .8, .3, 1) both; }
  .msg.enter.msg-bot > .avatar { animation: pop .5s cubic-bezier(.2, .9, .25, 1.3) both; }
  @keyframes botIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  .w { animation: wordIn .42s ease backwards; }
  @keyframes wordIn { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
  .msg-bot.revealing .codeblock { animation: botIn .5s ease .15s backwards; }
  .empty.leaving { animation: leave .18s ease forwards; }
  @keyframes leave { to { opacity: 0; transform: translateY(-8px) scale(.98); } }
  .msg-user { justify-content: flex-end; }
  .bubble { max-width: min(82%, 560px); padding: 10px 16px; background: var(--user-bg); color: var(--on-user); border-radius: 18px 18px 6px 18px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  .msg-bot .avatar { margin-top: 2px; }
  .msg-col { flex: 1; min-width: 0; }
  .prose { max-width: 72ch; line-height: 1.7; overflow-wrap: anywhere; }
  .prose > *:first-child { margin-top: 0; }
  .prose p { margin: 0 0 0.75em; }
  .prose p:last-child, .prose ul:last-child, .prose ol:last-child { margin-bottom: 0; }
  .prose ul, .prose ol { margin: 0 0 0.75em; padding-left: 1.4em; }
  .prose li { margin: 0.2em 0; padding-left: 0.2em; }
  .prose h4 { margin: 1em 0 0.35em; font-size: 1.02rem; font-weight: 700; }
  .prose a { color: var(--accent); text-underline-offset: 3px; }
  .prose strong { font-weight: 700; }
  .prose code { font-family: var(--mono); font-size: 0.86em; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); }
  .codeblock { margin: 0.4em 0 0.9em; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .codehead { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; background: var(--surface-2); font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
  .codeblock pre { padding: 14px; overflow-x: auto; }
  .codeblock pre code { padding: 0; background: none; font-size: 0.86rem; line-height: 1.6; white-space: pre; }
  .msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0.55; transition: opacity .15s; }
  .msg-bot:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
  .msg-bot.revealing .msg-actions { opacity: 0; pointer-events: none; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; font-size: 0.82rem; color: var(--muted); }
  .chip-btn:hover { background: var(--surface-2); color: var(--text); }
  .chip-btn .ic { width: 16px; height: 16px; }
  .typing { align-items: center; color: var(--muted); font-size: 0.92rem; }
  .typing:not([hidden]) { animation: botIn .3s ease both; }
  .dots { display: inline-flex; gap: 4px; margin-left: -6px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: bounce 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  .error-card { border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--line)); background: color-mix(in srgb, var(--danger) 9%, var(--surface)); border-radius: 12px; padding: 12px 14px; max-width: 72ch; }
  .error-card strong { display: block; font-weight: 600; }
  .error-card small { display: block; margin-top: 2px; color: var(--muted); overflow-wrap: anywhere; }
  .error-card button { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9rem; }
  .error-card button:hover { border-color: var(--accent); }

  /* ---------- empty state ---------- */
  .empty { margin: auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 24px 0; }
  .empty h2 { max-width: 20ch; font-size: clamp(1.45rem, 4.4vw, 1.95rem); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
  .empty p { color: var(--muted); }
  .prompts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 620px; margin-top: 10px; }
  .prompt { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 0.92rem; line-height: 1.4; transition: border-color .15s, background .15s; }
  .prompt:hover { border-color: var(--accent); background: var(--surface-2); }

  /* ---------- composer ---------- */
  .composer { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); position: relative; }
  .composer-inner { max-width: 780px; margin: 0 auto; }
  .field { display: flex; align-items: flex-end; gap: 8px; padding: 7px 7px 7px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; transition: border-color .15s, box-shadow .15s; }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .field textarea { flex: 1; min-width: 0; max-height: 160px; padding: 8px 0; background: none; border: 0; outline: 0; resize: none; font-size: 16px; line-height: 1.5; }
  .field textarea::placeholder { color: var(--muted); }
  .send { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--on-accent); transition: filter .15s, transform .1s; flex: none; }
  .send:hover:not(:disabled) { filter: brightness(1.1); }
  .send:active:not(:disabled) { transform: scale(0.94); }
  .send:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }
  .send.pulse { animation: sendPulse .4s ease; }
  @keyframes sendPulse { 0% { transform: scale(1); } 35% { transform: scale(.86); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .foot-note { margin-top: 8px; text-align: center; font-size: 0.78rem; color: var(--muted); }
  .jump { position: absolute; right: 18px; top: -50px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--text); }
  .jump:hover { border-color: var(--accent); }

  /* ---------- dialog and toast ---------- */
  dialog { margin: auto; width: min(92vw, 380px); padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(3, 8, 16, 0.6); backdrop-filter: blur(2px); }
  dialog h3 { font-size: 1.05rem; margin-bottom: 6px; }
  dialog p { color: var(--muted); margin-bottom: 18px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; }
  .btn:hover { border-color: var(--muted); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); padding: 9px 16px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 0.88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- small screens ---------- */
  @media (max-width: 899px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); z-index: 40; padding-top: calc(14px + env(safe-area-inset-top)); transform: translateX(-102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
    .app.sidebar-open .sidebar { transform: none; box-shadow: var(--shadow); }
    .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(3, 8, 16, 0.6); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .app.sidebar-open .scrim { opacity: 1; pointer-events: auto; }
    #menu-btn { display: grid; }
    .topbar .mobile-brand { display: inline-grid; }
    .text-btn span { display: none; }
    .text-btn { padding: 0; width: 40px; height: 40px; justify-content: center; }
    .prompts { grid-template-columns: 1fr; }
    .column { padding-top: 18px; }
    .hist-del { opacity: 1; }
  }
  @media (min-width: 900px) { #close-sidebar { display: none; } }
  @media (hover: none) { .hist-del { opacity: 1; } .msg-actions { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M20 20H9l-5-5a2 2 0 010-3l9-9a2 2 0 013 0l4 4a2 2 0 010 3L11 20M8 9l7 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
</svg>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="side-top">
      <div class="brand"><span class="avatar" id="brand-avatar" aria-hidden="true"></span><span>JARVIS AI</span></div>
      <button class="icon-btn" id="close-sidebar" type="button" aria-label="Close history"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button class="btn-primary" id="new-chat-btn" type="button"><svg class="ic"><use href="#i-plus"/></svg>New Chat</button>
    <label class="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <span class="sr-only">Search chats</span>
      <input id="chat-search" type="search" placeholder="Search chats" autocomplete="off">
    </label>
    <nav id="history-list" aria-label="Previous chats"></nav>
    <p class="side-foot">Chats are saved on this device only.</p>
  </aside>
  <div class="scrim" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Open history" aria-controls="sidebar"><svg class="ic"><use href="#i-menu"/></svg></button>
      <span class="avatar sm mobile-brand" id="top-avatar" aria-hidden="true"></span>
      <h1 class="chat-title" id="chat-title">New Chat</h1>
      <button class="text-btn" id="clear-btn" type="button" aria-label="Clear this chat"><svg class="ic"><use href="#i-eraser"/></svg><span>Clear</span></button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme"><svg class="ic" id="theme-icon"><use href="#i-sun"/></svg></button>
    </header>

    <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation">
      <div class="column">
        <div class="thread" id="thread"></div>
        <div class="msg msg-bot typing" id="typing" hidden>
          <span class="orb mini" aria-hidden="true"></span>
          <span id="typing-text">JARVIS is typing</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div id="error-slot"></div>
      </div>
    </div>

    <div class="composer">
      <button class="jump" id="jump-btn" type="button" aria-label="Scroll to latest message" hidden><svg class="ic"><use href="#i-down"/></svg></button>
      <div class="composer-inner">
        <div class="field">
          <label class="sr-only" for="user-input">Message JARVIS</label>
          <textarea id="user-input" rows="1" placeholder="Message JARVIS…" enterkeyhint="send" autocomplete="off"></textarea>
          <button class="send" id="send-btn" type="button" aria-label="Send message" disabled><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
        <p class="foot-note">JARVIS can make mistakes. Please verify important information.</p>
      </div>
    </div>
  </main>
</div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <form method="dialog">
    <h3 id="dialog-title">Are you sure?</h3>
    <p id="dialog-message"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn danger" value="ok" id="dialog-ok">Delete</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">JARVIS AI needs JavaScript to run.</p></noscript>

<script>
(() => {
  'use strict';

  /* ================= config ================= */
  const API_URL   = "https://website-1wy5.onrender.com/chat";
  const LOGO_URL  = "https://raw.githubusercontent.com/shiverror404/Website/main/file_00000000acdc82118e20363e93b6c517.png";
  const STORE_KEY = 'jarvis_multi_chats';   // same key and shape as before: existing chats keep working
  const THEME_KEY = 'jarvis_theme';
  const GREETING  = "Namaste, sir. Main JARVIS hoon. Aaj main aapki kya madad kar sakta hoon?";
  const REQUEST_TIMEOUT_MS = 60000;
  const PROMPTS = [
    "Ek simple Python script likho jo folder ki files rename kare",
    "Kal ki meeting ke liye ek chhota professional email draft karo",
    "Quantum computing ko aasan bhasha mein samjhao",
    "Mere liye 3 din ka beginner workout plan banao"
  ];

  /* ================= elements ================= */
  const $ = (id) => document.getElementById(id);
  const app = $('app'), sidebar = $('sidebar'), overlay = $('overlay');
  const menuBtn = $('menu-btn'), closeSidebarBtn = $('close-sidebar');
  const newChatBtn = $('new-chat-btn'), searchEl = $('chat-search'), historyList = $('history-list');
  const titleEl = $('chat-title'), clearBtn = $('clear-btn'), themeBtn = $('theme-btn'), themeIcon = $('theme-icon');
  const messagesEl = $('messages'), thread = $('thread'), typingEl = $('typing'), typingText = $('typing-text');
  const errorSlot = $('error-slot'), jumpBtn = $('jump-btn');
  const input = $('user-input'), sendBtn = $('send-btn');
  const dialog = $('dialog'), dialogMsg = $('dialog-message'), dialogOk = $('dialog-ok'), toastEl = $('toast');
  const desktopMQ = window.matchMedia('(min-width: 900px)');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= state ================= */
  let allChats = loadChats();
  let currentChatId = null;
  let busy = false;
  let pendingChatId = null;

  function loadChats() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!Array.isArray(v)) return [];
      return v.filter(c => c && c.id && Array.isArray(c.messages)).map(c => ({ ...c, id: String(c.id), title: c.title || 'New Chat' }));
    } catch (e) { return []; }
  }
  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(allChats)); } catch (e) { /* storage full or blocked */ }
    renderHistoryList();
    updateHeader();
  }
  const getChat = (id = currentChatId) => allChats.find(c => c.id === id);

  /* ================= small helpers ================= */
  const icon = (name) => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  function makeAvatar(extra = '') {
    const s = document.createElement('span');
    s.className = 'avatar ' + extra;
    s.setAttribute('aria-hidden', 'true');
    const img = new Image();
    img.alt = ''; img.decoding = 'async'; img.src = LOGO_URL;
    img.onerror = () => { img.remove(); s.textContent = 'J'; };
    s.appendChild(img);
    return s;
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
      return ok;
    }
  }
  function flashCopied(btn) {
    const label = btn.querySelector('span');
    if (!label) return;
    const old = label.textContent;
    label.textContent = 'Copied';
    setTimeout(() => { label.textContent = old; }, 1400);
  }

  function confirmDialog(message, okLabel) {
    if (typeof dialog.showModal !== 'function') return Promise.resolve(window.confirm(message));
    dialogMsg.textContent = message;
    dialogOk.textContent = okLabel;
    dialog.returnValue = '';
    dialog.showModal();
    return new Promise(resolve => {
      dialog.addEventListener('close', () => resolve(dialog.returnValue === 'ok'), { once: true });
    });
  }

  /* ================= safe mini-markdown ================= */
  const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function inlineFormat(s) {
    return s
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  }

  function renderMarkdown(src) {
    const blocks = [], inl = [];
    let text = String(src).replace(/\u0000/g, '');
    text = text.replace(/```([\w+#.-]*)[^\S\n]*\n?([\s\S]*?)```/g, (_, lang, code) => {
      blocks.push({ lang, code: code.replace(/\n$/, '') });
      return `\u0000B${blocks.length - 1}\u0000`;
    });
    text = escapeHtml(text);
    text = text.replace(/`([^`\n]+)`/g, (_, c) => { inl.push(c); return `\u0000I${inl.length - 1}\u0000`; });

    let out = '', para = [], list = null;
    const flushPara = () => { if (para.length) { out += '<p>' + para.map(inlineFormat).join('<br>') + '</p>'; para = []; } };
    const flushList = () => { if (list) { out += `<${list.t}>` + list.items.map(i => `<li>${inlineFormat(i)}</li>`).join('') + `</${list.t}>`; list = null; } };

    for (const line of text.split('\n')) {
      let m;
      if (/^\u0000B\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); out += line.trim(); continue; }
      if ((m = line.match(/^\s*[-*\u2022]\s+(.*)$/))) { flushPara(); if (!list || list.t !== 'ul') { flushList(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/)))   { flushPara(); if (!list || list.t !== 'ol') { flushList(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^#{1,4}\s+(.*)$/)))       { flushPara(); flushList(); out += `<h4>${inlineFormat(m[1])}</h4>`; continue; }
      if (!line.trim()) { flushPara(); flushList(); continue; }
      flushList(); para.push(line);
    }
    flushPara(); flushList();

    out = out.replace(/\u0000I(\d+)\u0000/g, (_, i) => `<code>${inl[+i]}</code>`);
    out = out.replace(/\u0000B(\d+)\u0000/g, (_, i) => {
      const b = blocks[+i];
      return `<div class="codeblock"><div class="codehead"><span>${escapeHtml(b.lang || 'code')}</span>` +
             `<button class="chip-btn" type="button" data-copy-code>${icon('copy')}<span>Copy</span></button></div>` +
             `<pre><code>${escapeHtml(b.code)}</code></pre></div>`;
    });
    return out;
  }

  /* ================= rendering ================= */
  // Wrap each word in a span with a staggered fade so a reply "flows in". Code blocks are skipped.
  function revealWords(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (!n.nodeValue.trim() || n.parentElement.closest('.codeblock')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    const total = nodes.reduce((n, t) => n + (t.nodeValue.match(/\S+/g) || []).length, 0);
    if (!total || total > 450) return 0;               // very long replies just fade in as a block
    const step = Math.min(0.032, 1.8 / total);          // seconds per word, whole reveal stays under ~1.8s
    let i = 0;
    nodes.forEach((node) => {
      const frag = document.createDocumentFragment();
      node.nodeValue.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
        const s = document.createElement('span');
        s.className = 'w';
        s.textContent = part;
        s.style.animationDelay = (i++ * step).toFixed(3) + 's';
        frag.appendChild(s);
      });
      node.parentNode.replaceChild(frag, node);
    });
    return (i * step + 0.5) * 1000;
  }
  function unwrapWords(root) {
    root.querySelectorAll('span.w').forEach((s) => s.replaceWith(document.createTextNode(s.textContent)));
    root.normalize();
  }

  function buildMessage(msg, animate) {
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'user' ? 'msg-user' : 'msg-bot') + (animate ? ' enter' : '');
    if (msg.role === 'user') {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = msg.content;
      el.appendChild(b);
    } else {
      el.appendChild(makeAvatar('sm'));
      const col = document.createElement('div'); col.className = 'msg-col';
      const body = document.createElement('div'); body.className = 'prose';
      body.innerHTML = renderMarkdown(msg.content);
      if (animate && !reduceMotion) {
        const ms = revealWords(body);
        if (ms) {
          el.classList.add('revealing');
          setTimeout(() => { unwrapWords(body); el.classList.remove('revealing'); }, ms);
        }
      }
      const actions = document.createElement('div'); actions.className = 'msg-actions';
      actions.innerHTML = `<button class="chip-btn" type="button" data-copy-msg>${icon('copy')}<span>Copy</span></button>`;
      col.append(body, actions);
      el.appendChild(col);
      el._raw = msg.content;
    }
    return el;
  }

  function buildEmpty() {
    const wrap = document.createElement('div');
    wrap.className = 'empty';
    const orb = document.createElement('div'); orb.className = 'orb';
    orb.appendChild(makeAvatar('lg'));
    const h = document.createElement('h2'); h.textContent = GREETING;
    const p = document.createElement('p'); p.textContent = 'Ask in Hindi, English or Hinglish.';
    const grid = document.createElement('div'); grid.className = 'prompts';
    PROMPTS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'prompt'; b.dataset.prompt = t; b.textContent = t;
      grid.appendChild(b);
    });
    wrap.append(orb, h, p, grid);
    return wrap;
  }

  function renderChat() {
    const chat = getChat();
    thread.replaceChildren();
    clearError();
    if (!chat || chat.messages.length === 0) thread.appendChild(buildEmpty());
    else chat.messages.forEach(m => thread.appendChild(buildMessage(m, false)));
    updateTyping();
    updateHeader();
    scrollToBottom(false);
  }

  async function appendMessage(msg) {
    const empty = thread.querySelector('.empty');
    if (empty) {
      if (reduceMotion) empty.remove();
      else {
        empty.classList.add('leaving');                 // let the welcome screen fade out first
        await new Promise((r) => setTimeout(r, 170));
        empty.remove();
      }
    }
    const el = buildMessage(msg, true);
    thread.appendChild(el);
    requestAnimationFrame(() => {
      // A long reply starts at its first line instead of jumping to its end.
      if (msg.role !== 'user' && el.offsetHeight > messagesEl.clientHeight * 0.7) {
        const top = messagesEl.scrollTop + el.getBoundingClientRect().top - messagesEl.getBoundingClientRect().top - 14;
        messagesEl.scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
      } else {
        scrollToBottom(true);
      }
    });
  }

  function updateHeader() {
    const chat = getChat();
    titleEl.textContent = chat ? chat.title : 'New Chat';
    clearBtn.disabled = !chat || chat.messages.length === 0;
  }

  function updateTyping() {
    const show = busy && pendingChatId === currentChatId;
    typingEl.hidden = !show;
    if (!show) typingText.textContent = 'JARVIS is typing';
    else scrollToBottom(true);
  }

  function scrollToBottom(smooth) {
    requestAnimationFrame(() => {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
    });
  }
  messagesEl.addEventListener('scroll', () => {
    const away = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight;
    jumpBtn.hidden = away < 240;
  }, { passive: true });
  jumpBtn.addEventListener('click', () => scrollToBottom(true));

  /* ---------- errors ---------- */
  let retryAction = null;
  function clearError() { errorSlot.replaceChildren(); retryAction = null; }
  function showError(title, detail, onRetry) {
    clearError();
    const card = document.createElement('div');
    card.className = 'error-card';
    card.setAttribute('role', 'alert');
    const strong = document.createElement('strong'); strong.textContent = title;
    card.appendChild(strong);
    if (detail) { const sm = document.createElement('small'); sm.textContent = detail; card.appendChild(sm); }
    if (onRetry) {
      retryAction = onRetry;
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.retry = '1';
      b.innerHTML = `${icon('retry')}<span>Retry</span>`;
      card.appendChild(b);
    }
    errorSlot.appendChild(card);
    scrollToBottom(true);
  }

  /* ---------- sidebar list ---------- */
  function dayLabel(id) {
    const d = new Date(Number(id));
    if (isNaN(d)) return 'Earlier';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((today - day) / 86400000);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff <= 7) return 'Previous 7 days';
    return 'Earlier';
  }

  function renderHistoryList() {
    const q = searchEl.value.trim().toLowerCase();
    historyList.replaceChildren();
    const items = [...allChats].sort((a, b) => Number(b.id) - Number(a.id))
      .filter(c => !q || (c.title || '').toLowerCase().includes(q));
    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'empty-list';
      p.textContent = q ? 'No chats match your search.' : 'No chats yet.';
      historyList.appendChild(p);
      return;
    }
    let lastLabel = '';
    items.forEach(chat => {
      const label = dayLabel(chat.id);
      if (label !== lastLabel) {
        const g = document.createElement('div'); g.className = 'group-label'; g.textContent = label;
        historyList.appendChild(g); lastLabel = label;
      }
      const row = document.createElement('div');
      row.className = 'hist-item' + (chat.id === currentChatId ? ' active' : '');
      const open = document.createElement('button');
      open.type = 'button'; open.className = 'hist-title'; open.textContent = chat.title || 'New Chat';
      if (chat.id === currentChatId) open.setAttribute('aria-current', 'true');
      open.addEventListener('click', () => loadChat(chat.id));
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'hist-del';
      del.setAttribute('aria-label', 'Delete chat: ' + (chat.title || 'New Chat'));
      del.innerHTML = icon('trash');
      del.addEventListener('click', (e) => { e.stopPropagation(); deleteChat(chat.id); });
      row.append(open, del);
      historyList.appendChild(row);
    });
  }
  searchEl.addEventListener('input', renderHistoryList);

  /* ================= chat actions ================= */
  function createNewChat() {
    const current = getChat();
    if (current && current.messages.length === 0) { closeSidebar(); input.focus(); return; }  // reuse the empty chat
    const chat = { id: Date.now().toString(), title: 'New Chat', messages: [] };
    allChats.push(chat);
    currentChatId = chat.id;
    persist();
    renderChat();
    closeSidebar();
  }

  function loadChat(id) {
    if (!getChat(id)) return;
    currentChatId = id;
    renderChat();
    renderHistoryList();
    closeSidebar();
  }

  async function deleteChat(id) {
    const ok = await confirmDialog('Kya aap ye chat delete karna chahte hain?', 'Delete');
    if (!ok) return;
    allChats = allChats.filter(c => c.id !== id);
    if (currentChatId === id) {
      if (allChats.length) { currentChatId = allChats[allChats.length - 1].id; persist(); renderChat(); }
      else { currentChatId = null; createNewChat(); }
    } else persist();
  }

  async function clearCurrentChat() {
    const chat = getChat();
    if (!chat || !chat.messages.length) return;
    const ok = await confirmDialog('Kya aap is chat ko clear karna chahte hain?', 'Clear');
    if (!ok) return;
    chat.messages = [];
    chat.title = 'New Chat';
    persist();
    renderChat();
  }

  function pushMessage(chatId, role, content) {
    const chat = getChat(chatId);
    if (!chat) return false;
    chat.messages.push({ role, content });
    if (role === 'user' && chat.messages.length === 1) {
      chat.title = content.substring(0, 25) + (content.length > 25 ? '...' : '');
    }
    persist();
    return true;
  }

  /* ================= sending ================= */
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    sendBtn.disabled = busy || !input.value.trim();
  }

  // The server expects history without quotes, stars, underscores or newlines (kept from the old version).
  const sanitizeForServer = (m) => ({
    role: m.role,
    content: String(m.content).replace(/"/g, '').replace(/\*/g, '').replace(/_/g, '').replace(/\n/g, ' ')
  });

  async function sendMessage(textOverride) {
    if (busy) return;
    const text = (typeof textOverride === 'string' ? textOverride : input.value).trim();
    if (!text) return;
    const chat = getChat();
    if (!chat) return;
    clearError();
    sendBtn.classList.remove('pulse'); void sendBtn.offsetWidth; sendBtn.classList.add('pulse');
    sendBtn.addEventListener('animationend', () => sendBtn.classList.remove('pulse'), { once: true });
    pushMessage(chat.id, 'user', text);
    input.value = '';
    autosize();
    await appendMessage({ role: 'user', content: text });
    if (getChat(chat.id)) await requestReply(chat.id, text);
  }

  async function requestReply(chatId, text) {
    const chat = getChat(chatId);
    if (!chat) return;
    busy = true; pendingChatId = chatId;
    sendBtn.disabled = true;
    clearError();
    updateTyping();

    const history = chat.messages.slice(0, -1).map(sanitizeForServer);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    const hintId = setTimeout(() => { typingText.textContent = 'Server is waking up, this can take up to a minute…'; }, 8000);
    const retry = () => { clearError(); requestReply(chatId, text); };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
        signal: controller.signal
      });
      let data = null;
      try { data = await response.json(); } catch (e) { /* not JSON */ }

      if (data && data.reply) {
        pushMessage(chatId, 'bot', String(data.reply));
        if (chatId === currentChatId) appendMessage({ role: 'bot', content: String(data.reply) });
      } else if (chatId === currentChatId) {
        const detail = data ? JSON.stringify(data).slice(0, 200) : 'HTTP ' + response.status;
        showError("The server didn't send a reply.", detail, retry);
      }
    } catch (err) {
      if (chatId === currentChatId) {
        const timedOut = err && err.name === 'AbortError';
        showError(
          timedOut ? 'The server took too long to respond.' : "Couldn't reach the server.",
          timedOut ? 'Try again in a moment.' : 'Check your connection and try again.',
          retry
        );
      }
    } finally {
      clearTimeout(timeoutId); clearTimeout(hintId);
      busy = false; pendingChatId = null;
      updateTyping();
      autosize();
      if (window.matchMedia('(pointer: fine)').matches) input.focus();
    }
  }

  /* ================= events ================= */
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', () => sendMessage());
  newChatBtn.addEventListener('click', createNewChat);
  clearBtn.addEventListener('click', clearCurrentChat);

  thread.addEventListener('click', async (e) => {
    const codeBtn = e.target.closest('[data-copy-code]');
    if (codeBtn) {
      const ok = await copyText(codeBtn.closest('.codeblock').querySelector('code').textContent);
      if (ok) flashCopied(codeBtn); else toast("Couldn't copy");
      return;
    }
    const msgBtn = e.target.closest('[data-copy-msg]');
    if (msgBtn) {
      const raw = msgBtn.closest('.msg')._raw || '';
      const ok = await copyText(raw);
      if (ok) flashCopied(msgBtn); else toast("Couldn't copy");
      return;
    }
    const prompt = e.target.closest('[data-prompt]');
    if (prompt) sendMessage(prompt.dataset.prompt);
  });
  errorSlot.addEventListener('click', (e) => {
    if (e.target.closest('[data-retry]') && retryAction) retryAction();
  });

  /* ---------- sidebar (drawer on small screens, fixed on desktop) ---------- */
  function syncSidebarA11y() {
    const hidden = !desktopMQ.matches && !app.classList.contains('sidebar-open');
    if ('inert' in sidebar) sidebar.inert = hidden;
    sidebar.setAttribute('aria-hidden', hidden ? 'true' : 'false');
    menuBtn.setAttribute('aria-expanded', String(app.classList.contains('sidebar-open')));
  }
  function openSidebar() { app.classList.add('sidebar-open'); syncSidebarA11y(); setTimeout(() => newChatBtn.focus(), 60); }
  function closeSidebar() {
    const wasOpen = app.classList.contains('sidebar-open');
    app.classList.remove('sidebar-open');
    syncSidebarA11y();
    if (wasOpen && !desktopMQ.matches) menuBtn.focus();
  }
  menuBtn.addEventListener('click', openSidebar);
  closeSidebarBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && app.classList.contains('sidebar-open')) closeSidebar(); });
  desktopMQ.addEventListener('change', () => { app.classList.remove('sidebar-open'); syncSidebarA11y(); });

  /* ---------- theme ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('meta-theme').setAttribute('content', t === 'light' ? '#f3f6fb' : '#0a111d');
    themeIcon.innerHTML = `<use href="#i-${t === 'light' ? 'moon' : 'sun'}"/>`;
    themeBtn.setAttribute('aria-label', t === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
  }
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  /* ================= start ================= */
  [$('brand-avatar'), $('top-avatar')].forEach(slot => {
    const img = new Image();
    img.alt = ''; img.decoding = 'async'; img.src = LOGO_URL;
    img.onerror = () => { img.remove(); slot.textContent = 'J'; };
    slot.appendChild(img);
  });

  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  syncSidebarA11y();

  if (allChats.length === 0) createNewChat();
  else { currentChatId = allChats[allChats.length - 1].id; renderChat(); renderHistoryList(); }
  autosize();
})();
</script>
</body>
</html>
